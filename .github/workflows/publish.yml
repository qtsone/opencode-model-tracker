name: Publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish, usually a release tag such as v1.0.0.
        required: true
        type: string
      publish:
        description: Set true to publish to npm. False runs validation and dry-run only.
        default: false
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit for high severity vulnerabilities
        run: npm run audit:high

      - name: Run tests
        run: npm test

      - name: Scan for private paths
        run: npm run check:private-paths

      - name: Validate package contents
        run: npm run pack:dry-run

      - name: Publish dry run
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: ${{ inputs.publish == true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
